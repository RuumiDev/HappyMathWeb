<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="mathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="url(#mathGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Math symbols -->
  <text x="8" y="12" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="url(#symbolGradient)">+</text>
  <text x="20" y="12" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="url(#symbolGradient)">×</text>
  <text x="6" y="22" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="url(#symbolGradient)">÷</text>
  <text x="22" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="url(#symbolGradient)">−</text>
  
  <!-- Central calculator/abacus icon -->
  <rect x="12" y="14" width="8" height="6" rx="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="14" cy="16" r="0.8" fill="url(#symbolGradient)"/>
  <circle cx="16" cy="16" r="0.8" fill="url(#symbolGradient)"/>
  <circle cx="18" cy="16" r="0.8" fill="url(#symbolGradient)"/>
  <circle cx="14" cy="18" r="0.8" fill="url(#symbolGradient)"/>
  <circle cx="16" cy="18" r="0.8" fill="url(#symbolGradient)"/>
  <circle cx="18" cy="18" r="0.8" fill="url(#symbolGradient)"/>
</svg>